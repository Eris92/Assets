name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check frontend
        shell: pwsh
        run: |
          Get-ChildItem wwwroot/*.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Invalid JavaScript: $($_.Name)" }
          }
      - name: Check PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - run: dotnet run --project tests/AccessPolicy/AccessPolicy.Tests.csproj -c Release
      - run: dotnet restore AssetsPortal.csproj
      - run: dotnet build AssetsPortal.csproj -c Release --no-restore
      - run: dotnet publish AssetsPortal.csproj -c Release -r win-x64 --self-contained false -p:UseAppHost=false -o out/AssetsPortal
      - name: Verify framework-dependent publish
        shell: pwsh
        run: |
          $config = Get-Content out/AssetsPortal/AssetsPortal.runtimeconfig.json -Raw | ConvertFrom-Json
          if ($config.runtimeOptions.includedFrameworks) { throw 'Unexpected self-contained output' }
          if (-not (@($config.runtimeOptions.frameworks.name) -contains 'Microsoft.AspNetCore.App')) {
            throw 'ASP.NET Core shared framework reference missing'
          }
          foreach ($file in @('coreclr.dll','hostfxr.dll','AssetsPortal.exe')) {
            if (Test-Path (Join-Path out/AssetsPortal $file)) { throw "Unexpected bundled runtime: $file" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: AssetsPortal-win-x64
          path: out/AssetsPortal/
          if-no-files-found: error
